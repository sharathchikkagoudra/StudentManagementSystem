<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 py-3">

    <a class="navbar-brand fw-bold fs-3"
       href="#">

        Student Management System

    </a>

    <div class="ms-auto">

        <button class="btn btn-danger"

                onclick="logout()">

            Logout

        </button>

    </div>

</nav>

<div class="container py-5">

    <!-- Heading -->

    <div class="text-center mb-5">

        <h1 class="fw-bold">

            Dashboard

        </h1>

        <p class="text-muted">

            Academic Analytics Overview

        </p>

    </div>

    <!-- Analytics Cards -->

    <div class="row g-4 mb-5">

        <div class="col-md-3">

            <div class="card shadow border-0 rounded-4 text-center p-4">

                <h5>Total Students</h5>

                <h2 id="totalStudents"
                    class="fw-bold text-primary">

                    0

                </h2>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow border-0 rounded-4 text-center p-4">

                <h5>Total Departments</h5>

                <h2 id="totalDepartments"
                    class="fw-bold text-success">

                    0

                </h2>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow border-0 rounded-4 text-center p-4">

                <h5>Total Courses</h5>

                <h2 id="totalCourses"
                    class="fw-bold text-warning">

                    0

                </h2>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow border-0 rounded-4 text-center p-4">

                <h5>Failed Students</h5>

                <h2 id="failedStudents"
                    class="fw-bold text-danger">

                    0

                </h2>

            </div>

        </div>

    </div>

    <!-- Charts -->

	<div class="card shadow border-0 rounded-4 p-4 mb-5">

	    <h4 class="fw-bold mb-4">

	        Top Rankers

	    </h4>

	    <div id="topRankers">

	    </div>

	</div>

    <!-- Quick Navigation -->

    <div class="card shadow border-0 rounded-4 p-4">

        <h3 class="fw-bold mb-4">

            Quick Navigation

        </h3>

        <div class="d-flex flex-wrap gap-3">

            <a href="students.html"
               class="btn btn-primary btn-lg">

                Students

            </a>

            <a href="departments.html"
               class="btn btn-success btn-lg">

                Departments

            </a>

            <a href="courses.html"
               class="btn btn-warning btn-lg">

                Courses

            </a>

            <a href="marks.html"
               class="btn btn-danger btn-lg">

                Marks

            </a>

            <a href="results.html"
               class="btn btn-dark btn-lg">

                Results

            </a>

            <a href="ranklist.html"
               class="btn btn-info btn-lg">

                Rank List

            </a>

        </div>

    </div>

</div>

<script src="js/auth.js"></script>
<script src="js/config.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
