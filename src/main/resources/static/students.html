    <link rel="stylesheet" href="css/style.css">

</head>

<!-- Main Container -->

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Students List</h2>

    </div>
	
	<!-- Add Student Form -->

	<div class="card border-0 shadow-lg rounded-4 mb-5">

	    <div class="card-body p-5">

	        <div class="mb-4">

	            <h2 class="fw-bold text-primary">
	                Add Student
	            </h2>

	            <p class="text-muted">
	                Fill the student details below
	            </p>

	        </div>

	        <form id="studentForm">

	            <div class="row g-4">

	                <!-- Name -->

	                <div class="col-md-6">

	                    <label class="form-label fw-semibold">
	                        Student Name
	                    </label>

	                    <input type="text"
	                           id="name"
	                           class="form-control form-control-lg rounded-3"
	                           placeholder="Enter student name"
	                           required>

	                </div>

	                <!-- USN -->

	                <div class="col-md-6">

	                    <label class="form-label fw-semibold">
	                        USN
	                    </label>

	                    <input type="text"
	                           id="usn"
	                           class="form-control form-control-lg rounded-3"
	                           placeholder="Enter USN"
	                           required>

	                </div>

	                <!-- Email -->

	                <div class="col-md-6">

	                    <label class="form-label fw-semibold">
	                        Email
	                    </label>

	                    <input type="email"
	                           id="email"
	                           class="form-control form-control-lg rounded-3"
	                           placeholder="Enter email"
	                           required>

	                </div>

	                <!-- Phone Number -->

	                <div class="col-md-6">

	                    <label class="form-label fw-semibold">
	                        Phone Number
	                    </label>

	                    <input type="text"
	                           id="phoneNumber"
	                           class="form-control form-control-lg rounded-3"
	                           placeholder="Enter phone number"
	                           required>

	                </div>

	                <!-- DOB -->

	                <div class="col-md-6">

	                    <label class="form-label fw-semibold">
	                        Date Of Birth
	                    </label>

	                    <input type="date"
	                           id="dateOfBirth"
	                           class="form-control form-control-lg rounded-3"
	                           required>

	                </div>

	                <!-- Department -->

					<div class="col-md-6">

					    <label class="form-label fw-semibold">
					        Department
					    </label>

					    <select id="departmentId"
					            class="form-select form-select-lg rounded-3"
					            required>

					        <option value="">
					            Select Department
					        </option>

					    </select>

					</div>
	            <!-- Button -->

	            <div class="mt-5">

					<button type="submit"
					        id="submitButton"
					        class="btn btn-primary btn-lg px-5 rounded-3 shadow-sm">

					    Add Student

					</button>

	            </div>

	        </form>

	    </div>

	</div>
	
	<!-- Search Section -->

	<div class="card border-0 shadow-sm rounded-4 mb-4">

	    <div class="card-body p-4">

	        <div class="row g-4">

	            <!-- Search By Name -->

	            <div class="col-md-6">

	                <label class="form-label fw-semibold">
	                    Search By Name
	                </label>

	                <input type="text"
	                       id="searchName"
	                       class="form-control form-control-lg rounded-3"
	                       placeholder="Enter student name">

	            </div>

	            <!-- Search By USN -->

	            <div class="col-md-6">

	                <label class="form-label fw-semibold">
	                    Search By USN
	                </label>

	                <input type="text"
	                       id="searchUsn"
	                       class="form-control form-control-lg rounded-3"
	                       placeholder="Enter USN">

	            </div>

	        </div>

	    </div>

	</div>

    <!-- Students Table -->

    <table class="table table-bordered table-striped shadow">

        <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>USN</th>
			<th>Email</th>
			<th>Phone Number</th>
			<th>Department</th>
			<th>Courses</th>
			<th>Actions</th>

        </tr>

        </thead>

        <tbody id="studentTableBody">

        </tbody>

    </table>

</div>

<!-- Assign Courses Modal -->

<div class="modal fade"
     id="assignCoursesModal"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <!-- Header -->

            <div class="modal-header">

                <h5 class="modal-title">

                    Assign Courses

                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">

                </button>

            </div>

            <!-- Body -->

            <div class="modal-body">

                <div id="coursesCheckboxContainer">

                </div>

            </div>

            <!-- Footer -->

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Close

                </button>

                <button type="button"
                        class="btn btn-primary"
                        onclick="submitAssignedCourses()">

                    Assign Courses

                </button>

            </div>

        </div>

    </div>

</div>

<script src="js/auth.js"></script>
