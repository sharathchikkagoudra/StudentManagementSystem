<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Failed Students</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 py-3">

    <a class="navbar-brand fw-bold fs-3"
       href="#">

        Student Management System

    </a>

    <div class="navbar-nav ms-auto">
		<a class="nav-link active"
		   href="index.html">

		   Dashboard

		</a>
		
        <a class="nav-link active"
           href="students.html">

           Students

        </a>

        <a class="nav-link active"
           href="courses.html">

           Courses

        </a>

        <a class="nav-link active"
           href="marks.html">

           Marks

        </a>

        <a class="nav-link active"
           href="results.html">

           Results

        </a>

        <a class="nav-link active"
           href="ranklist.html">

           Rank List

        </a>

        <a class="nav-link active"
           href="failed-students.html">

           Failed Students

        </a>
		<div class="ms-3">

		    <button class="btn btn-danger"

		            onclick="logout()">

		        Logout

		    </button>

		</div>

    </div>

</nav>

<div class="container py-5">

    <!-- Heading -->

    <div class="text-center mb-5">

        <h1 class="fw-bold text-danger">

            Failed Students

        </h1>

        <p class="text-muted">

            Students who failed in one or more subjects

        </p>

    </div>

    <!-- Search -->

    <div class="card shadow border-0 rounded-4 mb-5">

        <div class="card-body p-4">

            <div class="row">

                <div class="col-md-6">

                    <label class="form-label fw-bold">

                        Search By USN

                    </label>

                    <input type="text"
                           id="searchUsn"
                           class="form-control form-control-lg"
                           placeholder="Enter student USN">

                </div>

            </div>

        </div>

    </div>

    <!-- Failed Students Table -->

    <div class="card shadow-lg border-0 rounded-4">

        <div class="card-body p-4">

            <h3 class="fw-bold mb-4">

                Failed Students List

            </h3>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                    <tr>

                        <th>USN</th>
                        <th>Student</th>
                        <th>Failed Subjects</th>
                        <th>Percentage</th>
                        <th>Final Result</th>

                    </tr>

                    </thead>

                    <tbody id="failedStudentsTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>
<script src="js/auth.js"></script>
<script src="js/config.js"></script>
<script src="js/failed-students.js"></script>

</body>
</html>
